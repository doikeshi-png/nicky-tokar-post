kground:#281b1f;color:#fff;border-radius:999px;padding:12px 18px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:999}.toast.show{opacity:1;transform:translate(-50%,0)}

    .upload-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
    .upload-status{font-size:13px;color:var(--muted);min-height:20px;margin-top:10px;white-space:pre-wrap}

<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="brand-left">
          <img class="logo" src="./assets/images/logo-eye.png" alt="nicky tokar logo">
          <div><div class="brand-name">nicky tokar</div><div class="brand-sub" data-i18n="brandSub"></div></div>
        </div>
        <div class="top-actions">
          <div class="langs" aria-label="language">
            <button class="lang active" data-lang="ru">RU</button><button class="lang" data-lang="uk">UA</button><button class="lang" data-lang="en">EN</button><button class="lang" data-lang="de">DE</button>
          </div>
          <button class="btn soft tiny" id="randomExample" data-i18n="random"></button>
          <button class="btn soft tiny" id="clearAll" data-i18n="clear"></button>
        </div>
      </div>
    </header>

    <section class="hero">
      <div class="card pad">
        <h1 class="main-title" data-i18n="heroTitle"></h1>
        <p class="lead" data-i18n="heroLead"></p>
        <div class="mini-steps">
          <div class="step"><b>1</b><span data-i18n="step1"></span></div>
          <div class="step"><b>2</b><span data-i18n="step2"></span></div>
          <div class="step"><b>3</b><span data-i18n="step3"></span></div>
          <div class="step"><b>4</b><span data-i18n="step4"></span></div>
        </div>
      </div>
      <div class="card pad">
        <h2 data-i18n="publish"></h2>
        <div class="grid2">
          <div class="field"><label for="token" data-i18n="token"></label><input id="token" type="text" data-ph="tokenPh"><div class="hint" data-i18n="tokenHint"></div></div>
          <div class="field"><label for="chat" data-i18n="channel"></label><input id="chat" type="text" data-ph="channelPh"><div class="hint" data-i18n="channelHint"></div></div>
        </div>
        <button class="btn big" id="sendTop" data-i18n="send"></button>
        <div class="status" id="sendStatus"></div>
      </div>
    </section>

    <section class="hero" style="margin-top:18px">
      <div class="card pad">
        <h2 data-i18n="post"></h2>
        <div class="field"><label for="postTitle" data-i18n="postTitle"></label><input id="postTitle" type="text" data-ph="postTitlePh"></div>
        <div class="field"><label for="postText" data-i18n="postText"></label><textarea id="postText" data-ph="postTextPh"></textarea></div>
        <div class="title-row"><h3 data-i18n="badges"></h3><small data-i18n="optional"></small></div>
        <div class="grid2">
          <input id="badge1" type="text" data-ph="badge1Ph"><input id="badge2" type="text" data-ph="badge2Ph">
        </div>
        <input id="badge3" type="text" data-ph="badge3Ph" style="margin-top:10px">
        <div class="title-row"><h3 data-i18n="formatting"></h3><small data-i18n="multi"></small></div>
        <div class="formats" id="formatGrid">
          <label class="chip"><input type="checkbox" id="fmtBoldTitle" checked><span data-i18n="fmtTitle"></span></label>
          <label class="chip"><input type="checkbox" id="fmtBadges" checked><span data-i18n="fmtBadges"></span></label>
          <label class="chip"><input type="checkbox" id="fmtList"><span data-i18n="fmtList"></span></label>
          <label class="chip"><input type="checkbox" id="fmtQuote"><span data-i18n="fmtQuote"></span></label>
          <label class="chip"><input type="checkbox" id="fmtDetails"><span data-i18n="fmtDetails"></span></label>
          <label class="chip"><input type="checkbox" id="fmtTable"><span data-i18n="fmtTable"></span></label>
          <label class="chip"><input type="checkbox" id="fmtCarousel"><span data-i18n="fmtCarousel"></span></label>
          <label class="chip"><input type="checkbox" id="fmtCollage"><span data-i18n="fmtCollage"></span></label>
          <label class="chip"><input type="checkbox" id="fmtButton"><span data-i18n="fmtButton"></span></label>
        </div>
        <div class="extra" id="extraList"><div class="softbox"><label for="listText" data-i18n="listLabel"></label><textarea id="listText" data-ph="listPh"></textarea></div></div>
        <div class="extra" id="extraQuote"><div class="softbox"><label for="quoteText" data-i18n="quoteLabel"></label><textarea id="quoteText" data-ph="quotePh"></textarea></div></div>
        <div class="extra" id="extraDetails"><div class="softbox"><label for="detailsTitle" data-i18n="detailsLabel"></label><input id="detailsTitle" type="text" data-ph="detailsTitlePh"><textarea id="detailsText" data-ph="detailsTextPh" style="margin-top:10px"></textarea></div></div>
        <div class="extra" id="extraTable"><div class="softbox"><label for="tableText" data-i18n="tableLabel"></label><textarea id="tableText" data-ph="tablePh"></textarea></div></div>
        <div class="extra" id="extraGallery"><div class="softbox">
          <label for="mediaLinks" data-i18n="mediaLabel"></label>
          <textarea id="mediaLinks" data-ph="mediaPh"></textarea>
          <div class="hint" data-i18n="mediaHint"></div>
          <div class="upload-toolbar">
            <button type="button" class="btn soft upload-btn" id="uploadCloudBtn" data-i18n="cloudUpload"></button>
            <button type="button" class="btn soft" id="pasteCleanBtn" data-i18n="cleanLinks"></button>
            <input id="cloudFileInput" type="file" accept="image/*,video/*" multiple hidden>
          </div>
          <div class="upload-status" id="uploadStatus"></div>
          <details class="cloud-box" id="cloudSettingsBox">
            <summary data-i18n="cloudSettings"></summary>
            <div class="cloud-small" data-i18n="cloudSettingsHint"></div>
            <div class="grid2" style="margin-top:10px">
              <input id="cloudName" type="text" data-ph="cloudNamePh">
              <input id="uploadPreset" type="text" data-ph="uploadPresetPh">
            </div>
            <div class="link-tools">
              <button type="button" class="btn soft tiny" id="saveCloudSettings" data-i18n="cloudSave"></button>
              <button type="button" class="btn soft tiny" id="clearCloudSettings" data-i18n="cloudClear"></button>
            </div>
          </details>
        </div></div>
        <div class="extra" id="extraButton"><div class="softbox"><label data-i18n="buttonLabel"></label><div class="grid2"><input id="buttonText" type="text" data-ph="buttonTextPh"><input id="buttonUrl" type="text" data-ph="buttonUrlPh"></div></div></div>
        <div class="publish-card"><h2 data-i18n="ready"></h2><button class="btn big" id="sendBottom" data-i18n="send"></button><div class="status" id="sendStatus2"></div></div>
      </div>
      <div class="preview-col">
        <div class="card pad">
          <h2 data-i18n="previewTitle"></h2>
          <div class="phone"><div class="screen"><div class="tg-post" id="preview"></div></div></div>
          <div class="row-buttons"><button class="btn soft" id="copyHtml" data-i18n="copyHtml"></button><button class="btn soft" id="toggleCode" data-i18n="showCode"></button></div>
          <div class="codebox" id="codeWrap"><pre id="codeBox"></pre></div>
        </div>
        <div class="card pad"><h2 data-i18n="apiTitle"></h2><div class="api" id="apiResponse"></div></div>
      </div>
    </section>
  </div>
  <div class="toast" id="toast"></div>

function esc(s=''){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function attr(s=''){return esc(s).replace(/'/g,'&apos;')}
function nl(s=''){return esc(s).replace(/\n/g,'<br>')}
function t(k){return (T[currentLang]&&T[currentLang][k])||T.ru[k]||k}
function toast(txt){const el=$('toast');el.textContent=txt;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1700)}
function setLang(lang){currentLang=lang;document.documentElement.lang=lang==='uk'?'uk':lang;document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});document.querySelectorAll('[data-ph]').forEach(el=>{el.placeholder=t(el.dataset.ph)});document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));$('apiResponse').textContent=t('apiEmpty');$('toggleCode').textContent=$('codeWrap').classList.contains('show')?t('hideCode'):t('showCode');renderPreview()}
function getMediaLinks(){return $('mediaLinks').value.split(/\n+/).map(x=>x.trim()).filter(Boolean)}
function mediaTag(url){const u=attr(url.trim());if(!u)return'';return /\.(mp4|webm|mov|gif)(\?.*)?$/i.test(u)?`<video src="${u}"></video>`:`<img src="${u}"/>`}
function makeTable(raw){const rows=raw.split(/\n+/).map(r=>r.trim()).filter(Boolean);if(!rows.length)return'';return `<table bordered>\n${rows.map(r=>`<tr>${r.split('|').map(c=>`<td>${esc(c.trim())}</td>`).join('')}</tr>`).join('\n')}\n</table>`}
function hasContent(){return ['postTitle','postText','badge1','badge2','badge3','listText','quoteText','detailsText','tableText','mediaLinks'].some(id=>$(id).value.trim())}
function buildHtml(){
  const out=[];
  const title=$('postTitle').value.trim(), text=$('postText').value.trim();
  if(title) out.push($('fmtBoldTitle').checked?`<h1>${esc(title)}</h1>`:`<p><b>${esc(title)}</b></p>`);
  if(text) out.push(`<p>${nl(text)}</p>`);
  const badges=['badge1','badge2','badge3'].map(id=>$(id).value.trim()).filter(Boolean);
  if($('fmtBadges').checked&&badges.length) badges.forEach(b=>out.push(`<blockquote>${esc(b)}</blockquote>`));
  if($('fmtList').checked){const items=$('listText').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(items.length)out.push(`<ul>\n${items.map(i=>`<li>${esc(i)}</li>`).join('\n')}\n</ul>`)}
  if($('fmtQuote').checked&&$('quoteText').value.trim()) out.push(`<aside>${nl($('quoteText').value.trim())}</aside>`);
  if($('fmtTable').checked&&$('tableText').value.trim()) out.push(makeTable($('tableText').value.trim()));
  const links=getMediaLinks();
  if(links.length){
    if($('fmtCarousel').checked && links.length>1){
      out.push(`<tg-slideshow>\n${links.map(u=>'  '+mediaTag(u)).join('\n')}\n  <figcaption>${links.length} ${t('slides')}</figcaption>\n</tg-slideshow>`);
    }else if($('fmtCollage').checked && links.length>1){
      out.push(`<tg-collage>\n${links.map(u=>'  '+mediaTag(u)).join('\n')}\n</tg-collage>`);
    }else if($('fmtCarousel').checked || $('fmtCollage').checked){
      out.push(mediaTag(links[0]));
    }
  }
  if($('fmtDetails').checked){const title=$('detailsTitle').value.trim()||t('more'), body=$('detailsText').value.trim();if(body)out.push(`<details><summary>${esc(title)}</summary><p>${nl(body)}</p></details>`)}
  if(out.length) out.push(`<footer>${esc(t('made'))}</footer>`);
  return out.join('\n\n')
}
function buildReplyMarkup(){if(!$('fmtButton').checked)return null;const text=$('buttonText').value.trim(),url=$('buttonUrl').value.trim();return text&&url?{inline_keyboard:[[{text,url}]]}:null}
function renderPreview(){const html=buildHtml();let fake=html.replace(/<tg-slideshow>[\s\S]*?<\/tg-slideshow>/g,`<div class="media-placeholder">${t('carousel')}</div>`).replace(/<tg-collage>[\s\S]*?<\/tg-collage>/g,`<div class="media-placeholder">${t('collage')}</div>`).replace(/<img[^>]*>/g,`<div class="media-placeholder">${t('image')}</div>`).replace(/<video[^>]*>[\s\S]*?<\/video>/g,`<div class="media-placeholder">${t('video')}</div>`);$('preview').innerHTML=fake||`<p style="color:#8b747a">${t('previewEmpty')}</p>`;$('codeBox').textContent=html;document.querySelectorAll('.chip').forEach(ch=>{const inp=ch.querySelector('input');ch.classList.toggle('active',!!(inp&&inp.checked))});$('extraList').classList.toggle('show',$('fmtList').checked);$('extraQuote').classList.toggle('show',$('fmtQuote').checked);$('extraDetails').classList.toggle('show',$('fmtDetails').checked);$('extraTable').classList.toggle('show',$('fmtTable').checked);$('extraGallery').classList.toggle('show',$('fmtCarousel').checked||$('fmtCollage').checked);$('extraButton').classList.toggle('show',$('fmtButton').checked)}

function setUploadStatus(msg){if($('uploadStatus'))$('uploadStatus').textContent=msg||''}
function getCloudinarySettings(){
  const saved=JSON.parse(localStorage.getItem('nickyCloudinary')||'{}');
  const cloudName=($('cloudName')?.value||saved.cloudName||DEFAULT_CLOUDINARY.cloudName||'').trim();
  const uploadPreset=($('uploadPreset')?.value||saved.uploadPreset||DEFAULT_CLOUDINARY.uploadPreset||'').trim();
  return {cloudName,uploadPreset};
}
function loadCloudinarySettings(){
  const saved=JSON.parse(localStorage.getItem('nickyCloudinary')||'{}');
  if($('cloudName')) $('cloudName').value=saved.cloudName||DEFAULT_CLOUDINARY.cloudName||'';
  if($('uploadPreset')) $('uploadPreset').value=saved.uploadPreset||DEFAULT_CLOUDINARY.uploadPreset||'';
}
function saveCloudinarySettings(){
  const cloudName=$('cloudName').value.trim(), uploadPreset=$('uploadPreset').value.trim();
  localStorage.setItem('nickyCloudinary',JSON.stringify({cloudName,uploadPreset}));
  toast(t('cloudSaved'));setUploadStatus(t('cloudSaved'));
}
function clearCloudinarySettings(){
  localStorage.removeItem('nickyCloudinary');$('cloudName').value='';$('uploadPreset').value='';toast(t('cloudReset'));setUploadStatus(t('cloudReset'));
}
function appendMediaLinks(urls){
  const old=getMediaLinks();
  const all=[...old,...urls].filter(Boolean);
  $('mediaLinks').value=[...new Set(all)].join('\n');
  $('fmtCarousel').checked=true;
  if(all.length>1) $('fmtCollage').checked=false;
  renderPreview();
  $('mediaLinks').classList.remove('pulse-soft');void $('mediaLinks').offsetWidth;$('mediaLinks').classList.add('pulse-soft');
}
function cleanMediaLinks(){
  const clean=getMediaLinks().map(u=>u.replace(/[()]/g,'').replace(/\s+/g,'').trim()).filter(Boolean);
  $('mediaLinks').value=[...new Set(clean)].join('\n');
  renderPreview();toast(t('linksCleaned'));
}
async function uploadToCloudinary(files){
  const {cloudName,uploadPreset}=getCloudinarySettings();
  if(!cloudName||!uploadPreset){$('cloudSettingsBox').open=true;setUploadStatus(t('cloudNeed'));toast(t('cloudNeed'));return}
  if(!files||!files.length){setUploadStatus(t('cloudSelect'));return}
  setUploadStatus(`${t('cloudUploading')} 0/${files.length}`);
  const urls=[];
  for(let i=0;i<files.length;i++){
    const fd=new FormData();
    fd.append('file',files[i]);
    fd.append('upload_preset',uploadPreset);
    fd.append('folder','nicky_tokar_posts');
    try{
      const res=await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(cloudName)}/auto/upload`,{method:'POST',body:fd});
      const data=await res.json();
      if(!res.ok) throw new Error(data?.error?.message||res.statusText);
      const url=data.secure_url||data.url;
      if(url) urls.push(url);
      setUploadStatus(`${t('cloudUploading')} ${i+1}/${files.length}`);
    }catch(e){
      setUploadStatus(`${t('cloudError')}: ${e.message||e}`);
      return;
    }
  }
  if(urls.length){appendMediaLinks(urls);setUploadStatus(`${t('cloudDone')}: ${urls.length}`);toast(t('cloudDone'))}
}
async function sendPost(){const token=$('token').value.trim(),chat=$('chat').value.trim();if(!token){alert(t('needToken'));return}if(!chat){alert(t('needChat'));return}if(!hasContent()){alert(t('needPost'));return}$('sendStatus').textContent=t('sending');$('sendStatus2').textContent=t('sending');$('apiResponse').textContent=t('sending');try{const res=await fetch(`https://api.telegram.org/bot${token}/sendRichMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});const data=await res.json();const ok=data.ok?t('sent'):t('tgError');$('sendStatus').textContent=ok;$('sendStatus2').textContent=ok;$('apiResponse').textContent=JSON.stringify(data,null,2)}catch(e){$('sendStatus').textContent=t('sendError');$('sendStatus2').textContent=t('sendError');$('apiResponse').textContent=String(e.message||e)}}

fields.forEach(id=>$(id).addEventListener('input',renderPreview));checks.forEach(id=>$(id).addEventListener('change',renderPreview));document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));$('sendTop').addEventListener('click',sendPost);$('sendBottom').addEventListener('click',sendPost);$('copyHtml').addEventListener('click',async()=>{await navigator.clipboard.writeText(buildHtml());toast(t('copied'))});$('toggleCode').addEventListener('click',()=>{$('codeWrap').classList.toggle('show');$('toggleCode').textContent=$('codeWrap').classList.contains('show')?t('hideCode'):t('showCode')});$('randomExample').addEventListener('click',setExample);$('clearAll').addEventListener('click',()=>{if(!confirm(t('confirmClear')))return;fields.forEach(id=>{if(!['token','chat','cloudName','uploadPreset'].includes(id))$(id).value=''});checks.forEach(id=>$(id).checked=['fmtBoldTitle','fmtBadges'].includes(id));renderPreview();toast(t('cleared'))});if($('uploadCloudBtn'))$('uploadCloudBtn').addEventListener('click',()=>{$('cloudFileInput').click()});if($('cloudFileInput'))$('cloudFileInput').addEventListener('change',e=>uploadToCloudinary(e.target.files));if($('saveCloudSettings'))$('saveCloudSettings').addEventListener('click',saveCloudinarySettings);if($('clearCloudSettings'))$('clearCloudSettings').addEventListener('click',clearCloudinarySettings);if($('pasteCleanBtn'))$('pasteCleanBtn').addEventListener('click',cleanMediaLinks);loadCloudinarySettings();setLang('ru');
</script>
